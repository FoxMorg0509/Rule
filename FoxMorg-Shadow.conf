[Proxy Group]
bypass-system = true

private-ip-answer = true

ipv6 = true
prefer-ipv6 = false
icmp-auto-reply = true
udp-policy-not-supported-behaviour = REJECT
always-reject-url-rewrite = false

dns-server = https://dns.alidns.com/dns-query, https://doh.pub/dns-query

tun-excluded-routes = 10.0.0.0/8, 127.0.0.0/8, 169.254.0.0/16, 172.16.0.0/12, 192.0.0.0/24, 192.0.2.0/24, 192.88.99.0/24, 192.168.0.0/16, 198.51.100.0/24, 203.0.113.0/24, 224.0.0.0/4, 255.255.255.255/32, 239.255.255.250/32, ff02::fb/128

# 1. 隐藏的香港自动测速组（正则筛选名字带港/HK/Hong的节点，测速选优）
香港自动 = url-test, policy-regex-filter=(?i)港|HK|Hong, url=http://www.youtube.com, interval=300, hidden=1

# 2. 面板可见的香港手动组（默认用自动测速组，你也手动选其他香港节点）
香港 = select, 香港自动, policy-regex-filter=(?i)港|HK|Hong

[Rule]

#REJECT
RULE-SET,https://raw.githubusercontent.com/ACL4SSR/ACL4SSR/refs/heads/master/Clash/BanAD.list,REJECT
RULE-SET,https://raw.githubusercontent.com/ACL4SSR/ACL4SSR/refs/heads/master/Clash/BanProgramAD.list,REJECT
RULE-SET,https://raw.githubusercontent.com/ACL4SSR/ACL4SSR/refs/heads/master/Clash/BanEasyListChina.list,REJECT

#DIRECT
RULE-SET,https://raw.githubusercontent.com/ACL4SSR/ACL4SSR/refs/heads/master/Clash/ChinaDomain.list,DIRECT
RULE-SET,https://raw.githubusercontent.com/ACL4SSR/ACL4SSR/refs/heads/master/Clash/ChinaIp.list,DIRECT
RULE-SET,https://raw.githubusercontent.com/ACL4SSR/ACL4SSR/refs/heads/master/Clash/Apple.list,DIRECT
RULE-SET,https://raw.githubusercontent.com/ACL4SSR/ACL4SSR/refs/heads/master/Clash/Download.list,DIRECT

#
RULE-SET,https://raw.githubusercontent.com/ACL4SSR/ACL4SSR/refs/heads/master/Clash/Telegram.list,香港
RULE-SET,https://raw.githubusercontent.com/ACL4SSR/ACL4SSR/refs/heads/master/Clash/ProxyGFWlist.list,香港
FINAL,全球